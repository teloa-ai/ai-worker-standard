<text x="450" y="883" fill="#2f6b52" font-size="20" font-weight="500" text-anchor="start"><tspan x="450" dy="0">Skills、知识、记忆和例行按工作需要配置。</tspan></text>
<path d="M56 914 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56" y="955" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="56" dy="0">最小定义：身份与修订、职责边界，以及至少一项带验收要求的工作合同。</tspan></text>
