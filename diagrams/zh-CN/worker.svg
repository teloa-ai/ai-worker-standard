<text x="506" y="520" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="506" dy="0">工作与安排</tspan></text>
<text x="506" y="553" fill="#526b5e" font-size="21" font-weight="400" text-anchor="start"><tspan x="506" dy="0">输入输出 · 按需配置的例行任务</tspan></text>
