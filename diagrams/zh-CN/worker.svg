<rect x="790" y="508" width="354" height="102" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="810" y="539" fill="#223b30" font-size="22" font-weight="650" text-anchor="start"><tspan x="810" dy="0">工作与安排</tspan></text>
<text x="810" y="569" fill="#526b5e" font-size="18" font-weight="400" text-anchor="start"><tspan x="810" dy="0">输入输出 · 按需例行</tspan></text>
<path d="M758 676 H790" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="790" y="625" width="354" height="102" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="810" y="656" fill="#223b30" font-size="22" font-weight="650" text-anchor="start"><tspan x="810" dy="0">执行条件</tspan></text>
<text x="810" y="686" fill="#526b5e" font-size="18" font-weight="400" text-anchor="start"><tspan x="810" dy="0">工具 · 资料 · 有效授权</tspan></text>
<path d="M758 793 H790" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="790" y="742" width="354" height="102" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="810" y="773" fill="#223b30" font-size="22" font-weight="650" text-anchor="start"><tspan x="810" dy="0">经验与成果</tspan></text>
<text x="810" y="803" fill="#526b5e" font-size="18" font-weight="400" text-anchor="start"><tspan x="810" dy="0">记忆规则 · 成果与验收</tspan></text>
<rect x="56" y="874" width="1088" height="52" rx="10" fill="#e9f1eb" stroke="#e9f1eb" stroke-width="1.5"/>
<text x="78" y="907" fill="#2f6b52" font-size="22" font-weight="500" text-anchor="start"><tspan x="78" dy="0">产品保留各自名称；标准说明共同的身份、职责、工作合同与协作边界。</tspan></text>
<path d="M56 944 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56" y="985" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="56" dy="0">概念对应不代表厂商认证；是否符合本标准，仍需核对实际合同与宿主行为。</tspan></text>
</g></svg>