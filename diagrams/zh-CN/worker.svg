<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="AI 员工与 AI Worker 的关系"><title>AI 员工与 AI Worker 的关系</title><desc>Teloa 的产品叫 AI 员工；AI Worker 为其提供通用技术定义。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2f6b52" stroke-width="1.5"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8d6021" stroke-width="1.5"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="1030" fill="#f7f9f6"/>
<text x="56" y="53" fill="#2f6b52" font-size="17" font-weight="650" text-anchor="start"><tspan x="56" dy="0">01 / PRODUCT AND STANDARD</tspan></text>
<text x="1144" y="53" fill="#526b5e" font-size="16" font-weight="500" text-anchor="end"><tspan x="1144" dy="0">AI WORKER STANDARD 1.0</tspan></text>
<text x="56" y="116" fill="#223b30" font-size="40" font-weight="650" text-anchor="start"><tspan x="56" dy="0">AI 员工与 AI Worker 的关系</tspan></text>
<text x="56" y="160" fill="#526b5e" font-size="23" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Teloa 的产品叫 AI 员工；AI Worker 为其提供通用技术定义。</tspan></text>
<path d="M56 192 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56" y="240" fill="#2f6b52" font-size="17" font-weight="650" text-anchor="start"><tspan x="56" dy="0">产品概念</tspan></text>
<text x="410" y="240" fill="#2f6b52" font-size="17" font-weight="650" text-anchor="start"><tspan x="410" dy="0">通用标准概念</tspan></text>
<text x="790" y="240" fill="#2f6b52" font-size="17" font-weight="650" text-anchor="start"><tspan x="790" dy="0">组成说明</tspan></text>
<rect x="56" y="274" width="292" height="170" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="80" y="308" fill="#2f6b52" font-size="16" font-weight="650" text-anchor="start"><tspan x="80" dy="0">TELOA</tspan></text>
<text x="80" y="346" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="80" dy="0">AI 员工</tspan></text>
<text x="80" y="380" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">用户创建和协作的</tspan><tspan x="80" dy="28.6">持续工作个体</tspan></text>
<rect x="56" y="514" width="292" height="170" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="80" y="548" fill="#2f6b52" font-size="16" font-weight="650" text-anchor="start"><tspan x="80" dy="0">GROK</tspan></text>
<text x="80" y="586" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="80" dy="0">Bot</tspan></text>
<text x="80" y="620" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">另一种产品表达</tspan><tspan x="80" dy="28.6">同样可按 AI Worker 描述</tspan></text>
<path d="M348 359 H377 V479 H410" fill="none" stroke="#2f6b52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M348 599 H377 V479" fill="none" stroke="#2f6b52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="410" y="274" width="322" height="530" rx="20" fill="#223b30" stroke="#223b30" stroke-width="1.5"/>
<text x="438" y="318" fill="#bdd6c7" font-size="16" font-weight="650" text-anchor="start"><tspan x="438" dy="0">AI WORKER 标准</tspan></text>
<text x="438" y="374" fill="#fff" font-size="33" font-weight="650" text-anchor="start"><tspan x="438" dy="0">AI Worker</tspan></text>
<text x="438" y="422" fill="#fff" font-size="24" font-weight="500" text-anchor="start"><tspan x="438" dy="0">持续身份</tspan><tspan x="438" dy="34.8">明确职责</tspan></text>
<path d="M438 493 H704" fill="none" stroke="#537363" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="438" y="540" fill="#e2eee5" font-size="22" font-weight="500" text-anchor="start"><tspan x="438" dy="0">明确工作输入与输出</tspan><tspan x="438" dy="37.4">在授权范围内执行</tspan><tspan x="438" dy="37.4">交付可验收的成果</tspan></text>
<text x="438" y="719" fill="#bfd8c8" font-size="20" font-weight="400" text-anchor="start"><tspan x="438" dy="0">在 Teloa 中：</tspan><tspan x="438" dy="29">一个 Worker 实例</tspan><tspan x="438" dy="29">标识一位具体 AI 员工</tspan></text>
<path d="M732 538 H758 M758 325 V793" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M758 325 H790" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="790" y="274" width="354" height="102" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
