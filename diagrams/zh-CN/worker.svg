<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-label="一个 AI Worker，由什么组成"><title>一个 AI Worker，由什么组成</title><desc>身份和职责跨任务延续；工作在授权范围内，成果可以验收。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2f6b52" stroke-width="1.5"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8d6021" stroke-width="1.5"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="1000" fill="#f7f9f6"/>
<text x="56" y="53" fill="#2f6b52" font-size="17" font-weight="650" text-anchor="start"><tspan x="56" dy="0">01 / WORKER COMPOSITION</tspan></text>
<text x="1144" y="53" fill="#526b5e" font-size="16" font-weight="500" text-anchor="end"><tspan x="1144" dy="0">AI WORKER STANDARD 1.0</tspan></text>
<text x="56" y="116" fill="#223b30" font-size="40" font-weight="650" text-anchor="start"><tspan x="56" dy="0">一个 AI Worker，由什么组成</tspan></text>
<text x="56" y="160" fill="#526b5e" font-size="23" font-weight="400" text-anchor="start"><tspan x="56" dy="0">身份和职责跨任务延续；工作在授权范围内，成果可以验收。</tspan></text>
<path d="M56 192 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="248" width="320" height="565" rx="20" fill="#223b30" stroke="#223b30" stroke-width="1.5"/>
<text x="88" y="300" fill="#bdd6c7" font-size="17" font-weight="650" text-anchor="start"><tspan x="88" dy="0">AI WORKER</tspan></text>
<text x="88" y="365" fill="#fff" font-size="33" font-weight="650" text-anchor="start"><tspan x="88" dy="0">一个工作个体</tspan><tspan x="88" dy="47.85">持续承担职责</tspan></text>
<path d="M88 444 H344" fill="none" stroke="#537363" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="88" y="490" fill="#e2eee5" font-size="25" font-weight="500" text-anchor="start"><tspan x="88" dy="0">身份与固定修订</tspan><tspan x="88" dy="45">职责与判断边界</tspan><tspan x="88" dy="45">工作合同与验收</tspan></text>
<text x="88" y="710" fill="#bfd8c8" font-size="20" font-weight="400" text-anchor="start"><tspan x="88" dy="0">可以调用多个模型和 Agent</tspan><tspan x="88" dy="29">不要求独占机器或常驻进程</tspan></text>
