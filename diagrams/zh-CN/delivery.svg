<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-label="AI 员工协作，人负责验收"><title>AI 员工协作，人负责验收</title><desc>Teloa AI 员工对应 Worker；AI 团队按 Team 合同协作，人负责审批与验收。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2f6b52" stroke-width="1.5"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8d6021" stroke-width="1.5"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="1080" fill="#f7f9f6"/>
<text x="56" y="53" fill="#2f6b52" font-size="17" font-weight="650" text-anchor="start"><tspan x="56" dy="0">04 / DELIVERY WORKFLOW</tspan></text>
<text x="1144" y="53" fill="#526b5e" font-size="16" font-weight="500" text-anchor="end"><tspan x="1144" dy="0">AI WORKER STANDARD 1.0</tspan></text>
<text x="56" y="116" fill="#223b30" font-size="40" font-weight="650" text-anchor="start"><tspan x="56" dy="0">AI 员工协作，人负责验收</tspan></text>
<text x="56" y="160" fill="#526b5e" font-size="23" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Teloa AI 员工对应 Worker；AI 团队按 Team 合同协作，人负责审批与验收。</tspan></text>
<path d="M56 192 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="266" width="336" height="245" rx="18" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="80" y="304" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="start"><tspan x="80" dy="0">01</tspan></text>
<text x="368" y="304" fill="#2f6b52" font-size="17" font-weight="600" text-anchor="end"><tspan x="368" dy="0">人类负责人</tspan></text>
<text x="80" y="352" fill="#223b30" font-size="28" font-weight="650" text-anchor="start"><tspan x="80" dy="0">明确交办</tspan></text>
<text x="80" y="396" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">明确目标、输入与授权</tspan><tspan x="80" dy="31.9">选择团队工作入口</tspan><tspan x="80" dy="31.9">确定交付与验收要求</tspan></text>
