<text x="744" y="304" fill="#bfd8c8" font-size="17" font-weight="600" text-anchor="end"><tspan x="744" dy="0">Teloa／协调者</tspan></text>
<text x="456" y="352" fill="#fff" font-size="28" font-weight="650" text-anchor="start"><tspan x="456" dy="0">校验并分发</tspan></text>
<text x="456" y="396" fill="#d4e5da" font-size="22" font-weight="400" text-anchor="start"><tspan x="456" dy="0">检查合同、依赖与实例绑定</tspan><tspan x="456" dy="31.9">分发获准材料</tspan><tspan x="456" dy="31.9">建立实际任务归属</tspan></text>
<rect x="808" y="266" width="336" height="245" rx="18" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
