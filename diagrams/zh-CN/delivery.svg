<text x="456" y="714" fill="#fff" font-size="28" font-weight="650" text-anchor="start"><tspan x="456" dy="0">检查成果齐全</tspan></text>
<text x="456" y="758" fill="#d4e5da" font-size="22" font-weight="400" text-anchor="start"><tspan x="456" dy="0">汇总固定来源</tspan><tspan x="456" dy="31.9">检查必需输出是否齐全</tspan><tspan x="456" dy="31.9">保留贡献者和交接记录</tspan></text>
<rect x="56" y="628" width="336" height="245" rx="18" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="80" y="666" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="start"><tspan x="80" dy="0">06</tspan></text>
<text x="368" y="666" fill="#2f6b52" font-size="17" font-weight="600" text-anchor="end"><tspan x="368" dy="0">人类负责人</tspan></text>
<text x="80" y="714" fill="#223b30" font-size="28" font-weight="650" text-anchor="start"><tspan x="80" dy="0">验收与采用</tspan></text>
<text x="80" y="758" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">验收指定成果版本</tspan><tspan x="80" dy="31.9">明确是否用于业务</tspan><tspan x="80" dy="31.9">采用与验收分别记录</tspan></text>
