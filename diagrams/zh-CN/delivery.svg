<text x="832" y="396" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="832" dy="0">执行已交办的工作</tspan><tspan x="832" dy="31.9">固定报告与证据版本</tspan><tspan x="832" dy="31.9">记录实际贡献者</tspan></text>
<rect x="808" y="628" width="336" height="245" rx="18" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="832" y="666" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="start"><tspan x="832" dy="0">04</tspan></text>
