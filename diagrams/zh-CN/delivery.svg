<text x="832" y="714" fill="#223b30" font-size="28" font-weight="650" text-anchor="start"><tspan x="832" dy="0">确认接收并复核</tspan></text>
<text x="832" y="758" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="832" dy="0">确认接收或记录拒收原因</tspan><tspan x="832" dy="31.9">接收后按要求复核</tspan><tspan x="832" dy="31.9">固定复核意见</tspan></text>
