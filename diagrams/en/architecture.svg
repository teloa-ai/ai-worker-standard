<text x="80" y="886" fill="#8d6021" font-size="24" font-weight="650" text-anchor="start"><tspan x="80" dy="0">If a required contract or capability is unsupported</tspan></text>
<text x="80" y="922" fill="#8d6021" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">Retain the definition, report the gap, and mark the affected work as not ready.</tspan></text>
