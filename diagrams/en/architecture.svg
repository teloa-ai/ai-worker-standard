<text x="832" y="278" fill="#2f6b52" font-size="25" font-weight="650" text-anchor="start"><tspan x="832" dy="0">03  Delivery</tspan></text>
<rect x="72" y="312" width="304" height="115" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="96" y="350" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="96" dy="0">Core</tspan></text>
<text x="96" y="384" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="96" dy="0">id / revision / kind</tspan><tspan x="96" dy="26">Member references</tspan></text>
<rect x="72" y="459" width="304" height="192" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="96" y="497" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="96" dy="0">Required work profile</tspan></text>
<text x="96" y="531" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="96" dy="0">Responsibilities · I/O</tspan><tspan x="96" dy="26">Dependencies</tspan><tspan x="96" dy="26">Collaboration · Acceptance</tspan></text>
<text x="96" y="714" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="96" dy="0">JSON exchange</tspan><tspan x="96" dy="29">YAML authoring is optional</tspan></text>
<rect x="448" y="312" width="304" height="115" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="472" y="350" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="472" dy="0">Validate support</tspan></text>
<text x="472" y="384" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="472" dy="0">References · Contracts</tspan><tspan x="472" dy="26">Required capabilities</tspan></text>
<rect x="448" y="459" width="304" height="115" rx="16" fill="#223b30" stroke="#223b30" stroke-width="1.5"/>
<text x="472" y="497" fill="#ffffff" font-size="25" font-weight="650" text-anchor="start"><tspan x="472" dy="0">Bind and authorize</tspan></text>
<text x="472" y="531" fill="#d4e5da" font-size="20" font-weight="400" text-anchor="start"><tspan x="472" dy="0">Instance · Data · Model</tspan><tspan x="472" dy="26">Connections · Scope</tspan></text>
<rect x="448" y="606" width="304" height="155" rx="16" fill="#223b30" stroke="#223b30" stroke-width="1.5"/>
<text x="472" y="644" fill="#ffffff" font-size="25" font-weight="650" text-anchor="start"><tspan x="472" dy="0">One Run</tspan></text>
<text x="472" y="678" fill="#d4e5da" font-size="20" font-weight="400" text-anchor="start"><tspan x="472" dy="0">Fixed input versions</tspan><tspan x="472" dy="26">Effective authority</tspan><tspan x="472" dy="26">Actual executor</tspan></text>
<rect x="824" y="312" width="304" height="115" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="848" y="350" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="848" dy="0">Fixed artifact</tspan></text>
<text x="848" y="384" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="848" dy="0">Content + version</tspan><tspan x="848" dy="26">Actual contributors</tspan></text>
<rect x="824" y="459" width="304" height="115" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="848" y="497" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="848" dy="0">Acceptance</tspan></text>
<text x="848" y="531" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="848" dy="0">Explicit criteria</tspan><tspan x="848" dy="26">A fixed result version</tspan></text>
<rect x="824" y="606" width="304" height="155" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="848" y="644" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="848" dy="0">Business adoption</tspan></text>
<text x="848" y="678" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="848" dy="0">Decision by owner</tspan><tspan x="848" dy="26">Recorded separately</tspan><tspan x="848" dy="26">No implied approval</tspan></text>
