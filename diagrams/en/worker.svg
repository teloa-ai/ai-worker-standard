<text x="438" y="719" fill="#bfd8c8" font-size="20" font-weight="400" text-anchor="start"><tspan x="438" dy="0">In Teloa:</tspan><tspan x="438" dy="29">one Worker instance</tspan><tspan x="438" dy="29">identifies one AI employee.</tspan></text>
