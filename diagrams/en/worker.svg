<rect x="56" y="874" width="1088" height="52" rx="10" fill="#e9f1eb" stroke="#e9f1eb" stroke-width="1.5"/>
<text x="78" y="907" fill="#2f6b52" font-size="22" font-weight="500" text-anchor="start"><tspan x="78" dy="0">Products keep their names. The standard describes their identity, work and collaboration.</tspan></text>
