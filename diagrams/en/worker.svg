<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-label="What makes an AI Worker"><title>What makes an AI Worker</title><desc>A persistent work identity, with explicit responsibilities and verifiable output.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2f6b52" stroke-width="1.5"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8d6021" stroke-width="1.5"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="1000" fill="#f7f9f6"/>
<text x="56" y="53" fill="#2f6b52" font-size="17" font-weight="650" text-anchor="start"><tspan x="56" dy="0">01 / WORKER COMPOSITION</tspan></text>
<text x="1144" y="53" fill="#526b5e" font-size="16" font-weight="500" text-anchor="end"><tspan x="1144" dy="0">AI WORKER STANDARD 1.0</tspan></text>
<text x="56" y="116" fill="#223b30" font-size="40" font-weight="650" text-anchor="start"><tspan x="56" dy="0">What makes an AI Worker</tspan></text>
<text x="56" y="160" fill="#526b5e" font-size="23" font-weight="400" text-anchor="start"><tspan x="56" dy="0">A persistent work identity, with explicit responsibilities and verifiable output.</tspan></text>
<path d="M56 192 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="248" width="320" height="565" rx="20" fill="#223b30" stroke="#223b30" stroke-width="1.5"/>
<text x="88" y="300" fill="#bdd6c7" font-size="17" font-weight="650" text-anchor="start"><tspan x="88" dy="0">AI WORKER</tspan></text>
<text x="88" y="365" fill="#fff" font-size="33" font-weight="650" text-anchor="start"><tspan x="88" dy="0">One identity.</tspan><tspan x="88" dy="47.85">Ongoing work.</tspan></text>
<path d="M88 444 H344" fill="none" stroke="#537363" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="88" y="490" fill="#e2eee5" font-size="25" font-weight="500" text-anchor="start"><tspan x="88" dy="0">Identity + revision</tspan><tspan x="88" dy="45">Responsibilities</tspan><tspan x="88" dy="45">Work + acceptance</tspan></text>
<text x="88" y="710" fill="#bfd8c8" font-size="20" font-weight="400" text-anchor="start"><tspan x="88" dy="0">Not tied to one model,</tspan><tspan x="88" dy="29">machine or process.</tspan></text>
<path d="M376 530 H404 M404 296 V772" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M404 296 H432" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="432" y="248" width="712" height="89" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<circle cx="468" cy="292" r="21" fill="#e9f1eb"/>
<text x="468" y="299" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="middle"><tspan x="468" dy="0">01</tspan></text>
<text x="506" y="282" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="506" dy="0">Role and responsibility</tspan></text>
<text x="506" y="315" fill="#526b5e" font-size="21" font-weight="400" text-anchor="start"><tspan x="506" dy="0">Take on · Decide · Confirm · Escalate</tspan></text>
<path d="M404 415 H432" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="432" y="367" width="712" height="89" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<circle cx="468" cy="411" r="21" fill="#e9f1eb"/>
<text x="468" y="418" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="middle"><tspan x="468" dy="0">02</tspan></text>
<text x="506" y="401" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="506" dy="0">Methods and evidence</tspan></text>
<text x="506" y="434" fill="#526b5e" font-size="21" font-weight="400" text-anchor="start"><tspan x="506" dy="0">Skills · Knowledge · Procedures</tspan></text>
<path d="M404 534 H432" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="432" y="486" width="712" height="89" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<circle cx="468" cy="530" r="21" fill="#e9f1eb"/>
<text x="468" y="537" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="middle"><tspan x="468" dy="0">03</tspan></text>
<text x="506" y="520" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="506" dy="0">Work and arrangements</tspan></text>
<text x="506" y="553" fill="#526b5e" font-size="21" font-weight="400" text-anchor="start"><tspan x="506" dy="0">Inputs / outputs · Optional routines</tspan></text>
<path d="M404 653 H432" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="432" y="605" width="712" height="89" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<circle cx="468" cy="649" r="21" fill="#e9f1eb"/>
<text x="468" y="656" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="middle"><tspan x="468" dy="0">04</tspan></text>
<text x="506" y="639" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="506" dy="0">Execution conditions</tspan></text>
<text x="506" y="672" fill="#526b5e" font-size="21" font-weight="400" text-anchor="start"><tspan x="506" dy="0">Tools · Data scope · Authorization</tspan></text>
<path d="M404 772 H432" fill="none" stroke="#d4dfd6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="432" y="724" width="712" height="89" rx="16" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<circle cx="468" cy="768" r="21" fill="#e9f1eb"/>
<text x="468" y="775" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="middle"><tspan x="468" dy="0">05</tspan></text>
<text x="506" y="758" fill="#223b30" font-size="25" font-weight="650" text-anchor="start"><tspan x="506" dy="0">Experience and deliverables</tspan></text>
<text x="506" y="791" fill="#526b5e" font-size="21" font-weight="400" text-anchor="start"><tspan x="506" dy="0">Memory policy · Fixed artifacts · Acceptance</tspan></text>
<rect x="432" y="856" width="712" height="40" rx="8" fill="#e9f1eb" stroke="#e9f1eb" stroke-width="1.5"/>
<text x="450" y="883" fill="#2f6b52" font-size="20" font-weight="500" text-anchor="start"><tspan x="450" dy="0">Skills, knowledge, memory and routines are chosen per work.</tspan></text>
<path d="M56 914 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56" y="955" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Minimum: identity, responsibilities, and at least one Work contract with acceptance.</tspan></text>
</g></svg>