<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-label="AI employees deliver; people accept"><title>AI employees deliver; people accept</title><desc>Teloa AI employees are Workers; teams use Team contracts, with human approval and acceptance.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#2f6b52" stroke-width="1.5"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8d6021" stroke-width="1.5"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect width="1200" height="1080" fill="#f7f9f6"/>
<text x="56" y="53" fill="#2f6b52" font-size="17" font-weight="650" text-anchor="start"><tspan x="56" dy="0">04 / DELIVERY WORKFLOW</tspan></text>
<text x="1144" y="53" fill="#526b5e" font-size="16" font-weight="500" text-anchor="end"><tspan x="1144" dy="0">AI WORKER STANDARD 1.0</tspan></text>
<text x="56" y="116" fill="#223b30" font-size="40" font-weight="650" text-anchor="start"><tspan x="56" dy="0">AI employees deliver; people accept</tspan></text>
<text x="56" y="160" fill="#526b5e" font-size="23" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Teloa AI employees are Workers; teams use Team contracts, with human approval and acceptance.</tspan></text>
<path d="M56 192 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="266" width="336" height="245" rx="18" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="80" y="304" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="start"><tspan x="80" dy="0">01</tspan></text>
<text x="368" y="304" fill="#2f6b52" font-size="17" font-weight="600" text-anchor="end"><tspan x="368" dy="0">HUMAN OWNER</tspan></text>
<text x="80" y="352" fill="#223b30" font-size="28" font-weight="650" text-anchor="start"><tspan x="80" dy="0">Assign the work</tspan></text>
<text x="80" y="396" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">Define the objective,</tspan><tspan x="80" dy="31.9">inputs and authority.</tspan><tspan x="80" dy="31.9">Select the team Work.</tspan></text>
<rect x="432" y="266" width="336" height="245" rx="18" fill="#223b30" stroke="#223b30" stroke-width="1.5"/>
<text x="456" y="304" fill="#bfd8c8" font-size="19" font-weight="650" text-anchor="start"><tspan x="456" dy="0">02</tspan></text>
<text x="744" y="304" fill="#bfd8c8" font-size="17" font-weight="600" text-anchor="end"><tspan x="744" dy="0">TELOA / COORDINATOR</tspan></text>
<text x="456" y="352" fill="#fff" font-size="28" font-weight="650" text-anchor="start"><tspan x="456" dy="0">Check and dispatch</tspan></text>
<text x="456" y="396" fill="#d4e5da" font-size="22" font-weight="400" text-anchor="start"><tspan x="456" dy="0">Check contracts and bindings.</tspan><tspan x="456" dy="31.9">Distribute authorized input.</tspan><tspan x="456" dy="31.9">Establish assignment.</tspan></text>
<rect x="808" y="266" width="336" height="245" rx="18" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="832" y="304" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="start"><tspan x="832" dy="0">03</tspan></text>
<text x="1120" y="304" fill="#2f6b52" font-size="17" font-weight="600" text-anchor="end"><tspan x="1120" dy="0">ANALYST AI EMPLOYEE</tspan></text>
<text x="832" y="352" fill="#223b30" font-size="28" font-weight="650" text-anchor="start"><tspan x="832" dy="0">Deliver evidence</tspan></text>
<text x="832" y="396" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="832" dy="0">Complete the assigned work.</tspan><tspan x="832" dy="31.9">Version report and evidence.</tspan><tspan x="832" dy="31.9">Record contributors.</tspan></text>
<rect x="808" y="628" width="336" height="245" rx="18" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="832" y="666" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="start"><tspan x="832" dy="0">04</tspan></text>
<text x="1120" y="666" fill="#2f6b52" font-size="17" font-weight="600" text-anchor="end"><tspan x="1120" dy="0">REVIEW AI EMPLOYEE</tspan></text>
<text x="832" y="714" fill="#223b30" font-size="28" font-weight="650" text-anchor="start"><tspan x="832" dy="0">Receive and review</tspan></text>
<text x="832" y="758" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="832" dy="0">Accept or reject the handoff.</tspan><tspan x="832" dy="31.9">Continue after receipt.</tspan><tspan x="832" dy="31.9">Version the review result.</tspan></text>
<rect x="432" y="628" width="336" height="245" rx="18" fill="#223b30" stroke="#223b30" stroke-width="1.5"/>
<text x="456" y="666" fill="#bfd8c8" font-size="19" font-weight="650" text-anchor="start"><tspan x="456" dy="0">05</tspan></text>
<text x="744" y="666" fill="#bfd8c8" font-size="17" font-weight="600" text-anchor="end"><tspan x="744" dy="0">TELOA / COORDINATOR</tspan></text>
<text x="456" y="714" fill="#fff" font-size="28" font-weight="650" text-anchor="start"><tspan x="456" dy="0">Assemble the delivery</tspan></text>
<text x="456" y="758" fill="#d4e5da" font-size="22" font-weight="400" text-anchor="start"><tspan x="456" dy="0">Assemble fixed sources.</tspan><tspan x="456" dy="31.9">Check every required output.</tspan><tspan x="456" dy="31.9">Keep contributor records.</tspan></text>
<rect x="56" y="628" width="336" height="245" rx="18" fill="#ffffff" stroke="#d4dfd6" stroke-width="1.5"/>
<text x="80" y="666" fill="#2f6b52" font-size="19" font-weight="650" text-anchor="start"><tspan x="80" dy="0">06</tspan></text>
<text x="368" y="666" fill="#2f6b52" font-size="17" font-weight="600" text-anchor="end"><tspan x="368" dy="0">HUMAN OWNER</tspan></text>
<text x="80" y="714" fill="#223b30" font-size="28" font-weight="650" text-anchor="start"><tspan x="80" dy="0">Accept and decide</tspan></text>
<text x="80" y="758" fill="#526b5e" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">Accept a specified version.</tspan><tspan x="80" dy="31.9">Decide business adoption.</tspan><tspan x="80" dy="31.9">Record both separately.</tspan></text>
<path d="M392 388 H432" fill="none" stroke="#2f6b52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M768 388 H808" fill="none" stroke="#2f6b52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M976 511 V628" fill="none" stroke="#2f6b52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="952" y="576" fill="#2f6b52" font-size="19" font-weight="500" text-anchor="end"><tspan x="952" dy="0">Host handoff</tspan></text>
<path d="M808 750 H768" fill="none" stroke="#2f6b52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M432 750 H392" fill="none" stroke="#2f6b52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="56" y="916" width="1088" height="58" rx="10" fill="#e9f1eb" stroke="#e9f1eb" stroke-width="1.5"/>
<text x="80" y="952" fill="#2f6b52" font-size="21" font-weight="500" text-anchor="start"><tspan x="80" dy="0">Rejected handoff: record the reason and return to coordination; do not assume receipt.</tspan></text>
<path d="M56 994 H1144" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56" y="1035" fill="#526b5e" font-size="20" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Trace the same chain: authorized inputs → report → review → delivery package.</tspan></text>
</g></svg>